name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Sandbox for model-written code (bubblewrap)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q bubblewrap
          # Ubuntu 24.04 limits unprivileged user namespaces, which bubblewrap needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Unit tests (mock Ollama server, no models needed)
        env:
          LIGHT_EVAL_REQUIRE_JAIL: "1"
        run: python3 -m unittest discover -s tests -v
      - name: README results are up to date with docs/results
        run: |
          python3 tools/publish.py build
          git diff --exit-code README.md docs/assets
          # New, untracked chart files count too.
          test -z "$(git status --porcelain README.md docs/)" || { git status --porcelain README.md docs/; exit 1; }
      - name: Results site builds and its script parses
        run: |
          python3 tools/build_site.py
          node --check site/app.js
