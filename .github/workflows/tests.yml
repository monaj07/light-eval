name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests (mock Ollama server, no models needed)
        run: python3 -m unittest discover -s tests -v
      - name: README results are up to date with docs/results
        run: |
          python3 tools/publish.py build
          git diff --exit-code README.md docs/assets
