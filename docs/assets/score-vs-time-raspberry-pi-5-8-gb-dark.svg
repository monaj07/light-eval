<text x="548.5" y="158.2" font-size="12" font-weight="normal" text-anchor="middle" fill="#f0efec" stroke="#1a1a19" stroke-width="4" paint-order="stroke" font-family="system-ui, -apple-system, Segoe UI, sans-serif">gemma4:e4b · 67% (hung the Pi)</text>
<text x="386.0" y="216.0" font-size="12" font-weight="normal" text-anchor="end" fill="#f0efec" stroke="#1a1a19" stroke-width="4" paint-order="stroke" font-family="system-ui, -apple-system, Segoe UI, sans-serif">gemma4:e2b · 60%</text>
<text x="273.8" y="248.3" font-size="12" font-weight="normal" text-anchor="end" fill="#f0efec" stroke="#1a1a19" stroke-width="4" paint-order="stroke" font-family="system-ui, -apple-system, Segoe UI, sans-serif">qwen3.5:2b · 49%</text>
<text x="446.2" y="249.8" font-size="12" font-weight="normal" text-anchor="start" fill="#f0efec" stroke="#1a1a19" stroke-width="4" paint-order="stroke" font-family="system-ui, -apple-system, Segoe UI, sans-serif">qwen3.5:4b · 49%</text>
<text x="660.0" y="98.0" font-size="12" font-weight="600" text-anchor="start" fill="#f0efec" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Thinking</text>
<circle cx="667" cy="116" r="6" fill="#3987e5" fill-opacity="0.78"/>
<text x="680.0" y="120.0" font-size="12" font-weight="normal" text-anchor="start" fill="#c3c2b7" font-family="system-ui, -apple-system, Segoe UI, sans-serif">off</text>
<text x="660.0" y="154.0" font-size="12" font-weight="600" text-anchor="start" fill="#f0efec" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Memory in use</text>
<circle cx="682" cy="171.6" r="11.6" fill="none" stroke="#898781" stroke-width="1.5"/>
<text x="714.0" y="175.6" font-size="12" font-weight="normal" text-anchor="start" fill="#c3c2b7" font-family="system-ui, -apple-system, Segoe UI, sans-serif">2 GB</text>
<circle cx="682" cy="205.7" r="16.4" fill="none" stroke="#898781" stroke-width="1.5"/>
<text x="714.0" y="209.7" font-size="12" font-weight="normal" text-anchor="start" fill="#c3c2b7" font-family="system-ui, -apple-system, Segoe UI, sans-serif">4 GB</text>
<circle cx="682" cy="251.4" r="23.3" fill="none" stroke="#898781" stroke-width="1.5"/>
<text x="714.0" y="255.4" font-size="12" font-weight="normal" text-anchor="start" fill="#c3c2b7" font-family="system-ui, -apple-system, Segoe UI, sans-serif">8 GB</text>
<text x="660.0" y="296.7" font-size="11" font-weight="normal" text-anchor="start" fill="#898781" font-family="system-ui, -apple-system, Segoe UI, sans-serif">For scale: the Pi has</text>
<text x="660.0" y="311.7" font-size="11" font-weight="normal" text-anchor="start" fill="#898781" font-family="system-ui, -apple-system, Segoe UI, sans-serif">8 GB of RAM and</text>
<text x="660.0" y="326.7" font-size="11" font-weight="normal" text-anchor="start" fill="#898781" font-family="system-ui, -apple-system, Segoe UI, sans-serif">2 GB of zram.</text>
<circle cx="669" cy="356.6530085637446" r="8" fill="none" stroke="#c3c2b7" stroke-width="2" stroke-dasharray="4 3"/>
<text x="684.0" y="360.7" font-size="12" font-weight="normal" text-anchor="start" fill="#c3c2b7" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Didn't reliably fit</text>
</svg>
