<text x="54.0" y="336.0" font-size="12" font-weight="normal" text-anchor="end" fill="#898781" font-family="system-ui, -apple-system, Segoe UI, sans-serif">20%</text>
<line x1="64" x2="624" y1="272.0" y2="272.0" stroke="#2c2c2a" stroke-width="1"/>
<text x="54.0" y="276.0" font-size="12" font-weight="normal" text-anchor="end" fill="#898781" font-family="system-ui, -apple-system, Segoe UI, sans-serif">40%</text>
<line x1="64" x2="624" y1="212.0" y2="212.0" stroke="#2c2c2a" stroke-width="1"/>
<text x="54.0" y="216.0" font-size="12" font-weight="normal" text-anchor="end" fill="#898781" font-family="system-ui, -apple-system, Segoe UI, sans-serif">60%</text>
<line x1="64" x2="624" y1="152.0" y2="152.0" stroke="#2c2c2a" stroke-width="1"/>
<text x="54.0" y="156.0" font-size="12" font-weight="normal" text-anchor="end" fill="#898781" font-family="system-ui, -apple-system, Segoe UI, sans-serif">80%</text>
<line x1="64" x2="624" y1="92.0" y2="92.0" stroke="#2c2c2a" stroke-width="1"/>
<text x="54.0" y="96.0" font-size="12" font-weight="normal" text-anchor="end" fill="#898781" font-family="system-ui, -apple-system, Segoe UI, sans-serif">100%</text>
<line x1="64.0" x2="64.0" y1="92" y2="392" stroke="#2c2c2a" stroke-width="1"/>
<text x="64.0" y="412.0" font-size="12" font-weight="normal" text-anchor="middle" fill="#898781" font-family="system-ui, -apple-system, Segoe UI, sans-serif">3 s</text>
<line x1="289.1" x2="289.1" y1="92" y2="392" stroke="#2c2c2a" stroke-width="1"/>
<text x="289.1" y="412.0" font-size="12" font-weight="normal" text-anchor="middle" fill="#898781" font-family="system-ui, -apple-system, Segoe UI, sans-serif">10 s</text>
<line x1="494.4" x2="494.4" y1="92" y2="392" stroke="#2c2c2a" stroke-width="1"/>
<text x="494.4" y="412.0" font-size="12" font-weight="normal" text-anchor="middle" fill="#898781" font-family="system-ui, -apple-system, Segoe UI, sans-serif">30 s</text>
<line x1="624.0" x2="624.0" y1="92" y2="392" stroke="#2c2c2a" stroke-width="1"/>
<text x="624.0" y="412.0" font-size="12" font-weight="normal" text-anchor="middle" fill="#898781" font-family="system-ui, -apple-system, Segoe UI, sans-serif">1 min</text>
<text x="344.0" y="436.0" font-size="12" font-weight="normal" text-anchor="middle" fill="#c3c2b7" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Median time per case (log scale)</text>
<text x="64.0" y="80.0" font-size="12" font-weight="normal" text-anchor="start" fill="#c3c2b7" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Accuracy (share of all 65 cases passed)</text>
<text x="618.0" y="108.0" font-size="12" font-weight="normal" text-anchor="end" fill="#898781" font-family="system-ui, -apple-system, Segoe UI, sans-serif">better ↖</text>
<circle cx="548.5" cy="192.0" r="25.8" fill="#3987e5" fill-opacity="0.78" stroke="#c3c2b7" stroke-width="2" stroke-dasharray="4 3"/>
<circle cx="414.1" cy="212.0" r="20.0" fill="#3987e5" fill-opacity="0.78" stroke="#1a1a19" stroke-width="2"/>
<circle cx="419.0" cy="245.8" r="19.2" fill="#3987e5" fill-opacity="0.78" stroke="#1a1a19" stroke-width="2"/>
