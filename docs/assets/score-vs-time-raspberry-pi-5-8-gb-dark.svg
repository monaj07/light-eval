<svg xmlns="http://www.w3.org/2000/svg" width="920" height="470" viewBox="0 0 920 470" role="img" aria-label="Accuracy and speed on Raspberry Pi 5 (8 GB)">
<rect width="920" height="470" rx="8" fill="#1a1a19"/>
<text x="24.0" y="34.0" font-size="16" font-weight="600" text-anchor="start" fill="#f0efec" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Accuracy and speed on Raspberry Pi 5 (8 GB)</text>
<text x="24.0" y="56.0" font-size="12" font-weight="normal" text-anchor="start" fill="#c3c2b7" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Higher is more accurate, further left is faster. Colour: thinking mode; bubble area: peak memory in use (RAM + zram).</text>
<line x1="64" x2="624" y1="392.0" y2="392.0" stroke="#383835" stroke-width="1"/>
<text x="54.0" y="396.0" font-size="12" font-weight="normal" text-anchor="end" fill="#898781" font-family="system-ui, -apple-system, Segoe UI, sans-serif">0%</text>
