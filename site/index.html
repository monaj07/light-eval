  <template id="about-text">
    <h1>About these results</h1>
    <h2>What is measured</h2>
    <p>Light Eval asks each model 65 questions in five tracks of 13 cases. Each track mixes easy <em>control</em>
      cases with harder <em>challenges</em>:</p>
    <ul>
      <li><strong>Arithmetic</strong>: word problems with a single numeric answer.</li>
      <li><strong>Structured</strong>: extracting typed JSON from text.</li>
      <li><strong>Agent</strong>: calling simulated tools in the right order, with the right arguments, and reporting the result.</li>
      <li><strong>Vision</strong>: counting and reading in synthetic images.</li>
      <li><strong>Context</strong>: finding facts in logs of 16 to 96 records, with distractors.</li>
    </ul>
    <h2>How answers are scored</h2>
    <p>Every answer is a typed JSON value compared exactly with the expected one; tool calls are checked call by call,
      including the final state. No model grades another. Accuracy is the share of cases passed on the tracks a model
      can attempt: a text-only model is not given 0% for vision.</p>
    <h2>Thinking off and on</h2>
    <p>Models that can reason before answering are run twice, with thinking off and on, each with its own token budget
      (1,024 and 6,144 tokens per turn). Every case has a 10-minute limit. Compare models only within one mode.</p>
    <h2>Fairness and repeatability</h2>
    <p>Each model runs three passes in a rotating order, and the Pi cools to the same temperature band before every
      model loads. Outputs are close but not identical between passes, so scores are averaged and each result shows
      its range across passes.</p>
    <p class="note">Model logos belong to their makers and are shown only to identify the models. Visits are counted with GoatCounter, without cookies or any personal data.</p>
